<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a78ff"/>
      <stop offset="1" stop-color="#3c55d6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <!-- downward trend line: weight management -->
  <polyline points="12,22 24,32 34,28 52,44"
            fill="none" stroke="#ffffff" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="22" r="3.4" fill="#ffffff"/>
  <circle cx="24" cy="32" r="3.4" fill="#ffffff"/>
  <circle cx="34" cy="28" r="3.4" fill="#ffffff"/>
  <circle cx="52" cy="44" r="3.4" fill="#10b981"/>
  <!-- baseline -->
  <line x1="12" y1="52" x2="52" y2="52" stroke="#ffffff" stroke-opacity="0.45"
        stroke-width="2.5" stroke-linecap="round"/>
</svg>
