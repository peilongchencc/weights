<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>每日体重记录</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>每日体重记录</h1>
            <p class="subtitle">记录体重 · 计算 3 日 / 7 日移动平均</p>
        </header>

        <section class="card form-card">
            <div class="form-top">
                <p class="tip">💡 为保证数据准确，建议每日晨起如厕后空腹称重。</p>
                <div class="profile-bar">
                <div class="profile-view" id="profile-view">
                    <span class="profile-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 8h4M3 12h6M3 16h4M16 3v4M12 3v6M16 3v4"/></svg>
                    </span>
                    <span class="profile-label">身高</span>
                    <span class="profile-value" id="profile-height">--</span>
                    <button type="button" class="profile-btn" id="profile-edit-btn">编辑</button>
                </div>
                <form class="profile-edit" id="profile-edit" hidden>
                    <span class="profile-label">身高</span>
                    <span class="profile-input-wrap">
                        <input
                            type="number"
                            id="height"
                            name="height"
                            class="profile-input"
                            step="0.1"
                            min="50"
                            max="300"
                            placeholder="175"
                        />
                        <span class="profile-unit">cm</span>
                    </span>
                    <button type="submit" class="profile-btn profile-btn-primary">保存</button>
                    <button type="button" class="profile-btn" id="profile-cancel-btn">取消</button>
                    <span id="profile-msg" class="profile-msg"></span>
                </form>
                </div>
            </div>
            <form id="record-form" class="form">
                <div class="field">
                    <label for="date">日期</label>
                    <input type="date" id="date" name="date" required />
                </div>
                <div class="field">
                    <label for="weight">体重 (kg) <span class="required">*</span></label>
                    <input
                        type="number"
                        id="weight"
                        name="weight"
                        step="0.01"
                        min="0.1"
                        placeholder="如: 91.10"
                        required
                    />
                </div>
                <div class="field field-wide">
                    <label for="note">备注 (可选)</label>
                    <input type="text" id="note" name="note" maxlength="500" placeholder="记录前一天的饮食/运动/异常情况(如「昨晚吃了火锅」),方便日后回看波动原因。" />
                </div>
                <p id="date-hint" class="date-hint" hidden></p>
                <button type="submit" id="submit-btn" class="btn-primary">保存记录</button>
            </form>
            <p id="form-msg" class="form-msg"></p>
        </section>

        <section class="card stats-card" id="stats-card"></section>

        <section class="card indulgence-card">
            <div class="indulgence-head">
                <h2>放纵记录</h2>
                <p class="subtitle-inline">压力大想喝啤酒、有进展想奖励自己时，先记一笔，提醒自己别贪杯多吃。</p>
            </div>

            <div class="streak-banner" id="streak-banner">
                <div class="streak-main">
                    <span class="streak-label">已坚持</span>
                    <span class="streak-days" id="streak-days">--</span>
                    <span class="streak-label">天没放纵</span>
                </div>
                <div class="streak-sub" id="streak-sub">暂无放纵记录</div>
            </div>

            <form id="indulgence-form" class="indulgence-form">
                <div class="field">
                    <label for="ind-date">日期</label>
                    <input type="date" id="ind-date" name="ind-date" required />
                </div>
                <div class="field">
                    <label>类型 <span class="label-hint">(可多选)</span></label>
                    <div class="seg-group" id="ind-kind" data-multi="true" data-value="alcohol">
                        <button type="button" class="seg-btn active" data-val="alcohol">🍺 喝酒</button>
                        <button type="button" class="seg-btn" data-val="food">🍰 吃好吃的</button>
                    </div>
                </div>
                <div class="field">
                    <label>触发原因</label>
                    <div class="seg-group" id="ind-trigger" data-value="stress">
                        <button type="button" class="seg-btn active" data-val="stress">😣 压力大</button>
                        <button type="button" class="seg-btn" data-val="reward">🎉 奖励自己</button>
                    </div>
                </div>
                <div class="field field-wide">
                    <label for="ind-note">备注 (可选)</label>
                    <input type="text" id="ind-note" name="ind-note" maxlength="500" placeholder="如「项目上线，喝了 3 瓶」，方便日后回看自己的触发规律。" />
                </div>
                <button type="submit" class="btn-primary">记一笔</button>
            </form>
            <p id="indulgence-msg" class="form-msg"></p>

            <div class="ind-list-wrap">
                <table id="indulgence-table">
                    <thead>
                        <tr><th>日期</th><th>类型</th><th>触发原因</th><th>备注</th><th>操作</th></tr>
                    </thead>
                    <tbody id="indulgence-body"></tbody>
                </table>
            </div>
            <p id="ind-empty-tip" class="empty-tip" hidden>还没有放纵记录，继续保持~</p>
        </section>

        <section class="card chart-card">
            <h2>趋势图</h2>
            <div id="chart" class="chart"></div>
            <div class="legend" id="chart-legend"></div>
        </section>

        <section class="card table-card">
            <h2>历史记录</h2>
            <div class="table-wrap">
                <table id="record-table">
                    <thead>
                        <tr id="record-head"></tr>
                    </thead>
                    <tbody id="record-body"></tbody>
                </table>
            </div>
            <p id="empty-tip" class="empty-tip" hidden>暂无记录, 快来记录第一笔吧~</p>
            <div class="pager" id="pager" hidden>
                <button id="page-prev" class="btn-page" type="button">上一页</button>
                <span id="page-info" class="page-info"></span>
                <button id="page-next" class="btn-page" type="button">下一页</button>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
