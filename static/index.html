<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>每日体重记录</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>每日体重记录</h1>
            <p class="subtitle">记录体重 · 计算 3 日 / 7 日移动平均</p>
        </header>

        <section class="card form-card">
            <p class="tip">💡 为保证数据准确，建议每日晨起如厕后空腹称重。。</p>
            <div class="profile-bar">
                <div class="profile-view" id="profile-view">
                    <span class="profile-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 8h4M3 12h6M3 16h4M16 3v4M12 3v6M16 3v4"/></svg>
                    </span>
                    <span class="profile-label">身高</span>
                    <span class="profile-value" id="profile-height">--</span>
                    <button type="button" class="profile-btn" id="profile-edit-btn">编辑</button>
                </div>
                <form class="profile-edit" id="profile-edit" hidden>
                    <span class="profile-label">身高</span>
                    <span class="profile-input-wrap">
                        <input
                            type="number"
                            id="height"
                            name="height"
                            class="profile-input"
                            step="0.1"
                            min="50"
                            max="300"
                            placeholder="175"
                        />
                        <span class="profile-unit">cm</span>
                    </span>
                    <button type="submit" class="profile-btn profile-btn-primary">保存</button>
                    <button type="button" class="profile-btn" id="profile-cancel-btn">取消</button>
                    <span id="profile-msg" class="profile-msg"></span>
                </form>
            </div>
            <form id="record-form" class="form">
                <div class="field">
                    <label for="date">日期</label>
                    <input type="date" id="date" name="date" required />
                </div>
                <div class="field">
                    <label for="weight">体重 (kg) <span class="required">*</span></label>
                    <input
                        type="number"
                        id="weight"
                        name="weight"
                        step="0.01"
                        min="0.1"
                        placeholder="例如 91.10"
                        required
                    />
                </div>
                <div class="field field-wide">
                    <label for="note">备注 (可选)</label>
                    <input type="text" id="note" name="note" maxlength="500" placeholder="例如 晨起空腹" />
                </div>
                <button type="submit" class="btn-primary">保存记录</button>
            </form>
            <p id="form-msg" class="form-msg"></p>
        </section>

        <section class="card stats-card" id="stats-card"></section>

        <section class="card chart-card">
            <h2>趋势图</h2>
            <div id="chart" class="chart"></div>
            <div class="legend" id="chart-legend"></div>
        </section>

        <section class="card table-card">
            <h2>历史记录</h2>
            <div class="table-wrap">
                <table id="record-table">
                    <thead>
                        <tr id="record-head"></tr>
                    </thead>
                    <tbody id="record-body"></tbody>
                </table>
            </div>
            <p id="empty-tip" class="empty-tip" hidden>暂无记录, 快来记录第一笔吧~</p>
            <div class="pager" id="pager" hidden>
                <button id="page-prev" class="btn-page" type="button">上一页</button>
                <span id="page-info" class="page-info"></span>
                <button id="page-next" class="btn-page" type="button">下一页</button>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
